[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "realtime-lakehouse-framework"
version = "0.1.0"
description = "A lightweight real-time data processing framework for lakehouse medallion pipelines."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Data Engineering Team" }]
license = { text = "MIT" }
keywords = ["data-engineering", "streaming", "lakehouse", "medallion", "etl"]
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Database",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
realtime-lakehouse = "realtime_lakehouse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
